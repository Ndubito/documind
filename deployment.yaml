apiVersion: apps/v1
kind: Deployment
metadata:
  name: documind-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: documind
  template:
    metadata:
      labels:
        app: documind
    spec:
      containers:
      - name: documind
        image: documindacrnna2005.azurecr.io/documind:v2
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
  